<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paddy Disease Detection – Upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Paddy Crop Disease Detection</h1>

    <div class="card">
      <h2>Upload Leaf Image</h2>

      <form id="upload-form">
        <label for="file-input" class="file-label">
          Choose Image
        </label>
        <input type="file" id="file-input" name="file" accept="image/*" required />

        <button type="submit" class="btn">Predict Disease</button>
      </form>

      <div id="preview-container" class="preview hidden">
        <h3>Preview</h3>
        <img id="image-preview" alt="Image preview" />
      </div>

      <div id="result" class="result hidden">
        <h3>Prediction Result</h3>
        <p><strong>Disease:</strong> <span id="disease-name"></span></p>
        <p><strong>Confidence:</strong> <span id="confidence"></span></p>
      </div>

      <div id="error-message" class="error hidden"></div>
    </div>

    <a href="dashboard.html" class="link">Go to Dashboard →</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
